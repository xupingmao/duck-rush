<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Rush Web 工具中心</title>
    <link rel="stylesheet" href="css/shell.css">
    <script>
        /* 尽早应用主题，避免加载时闪烁 */
        (function () {
            try {
                var t = localStorage.getItem("shell_theme") || "dark";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <!-- 左侧导航栏 -->
    <div class="sidebar">
            <div class="brand">
                <span class="logo-dot"></span>
                <span class="brand-name">Duck Rush 工具中心</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <!-- 导航菜单将通过 JavaScript 动态生成 -->
            </ul>

            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle" type="button" title="切换明暗主题">
                    <span class="tt-icon">🌙</span>
                    <span class="tt-label">深色</span>
                </button>
                <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="收起/展开侧边栏">
                    <span class="toggle-icon">«</span>
                </button>
            </div>
        </div>

        <!-- 右侧内容区域 -->
        <div class="content">
            <div class="content-header">
                <h2 id="pageTitle">欢迎使用 Duck Rush 工具中心</h2>
                <div class="page-tabs hide"></div>
                <div class="header-actions">
                    <button class="open-new-window" id="openNewWindowBtn" title="在新Tab页中打开当前页面">
                        <span>新Tab页打开</span>
                    </button>
                </div>
            </div>
            <div class="iframe-container">
                <iframe id="contentFrame" src=""></iframe>
            </div>
        </div>

    <script src="js/index.config.js"></script>
    <script src="js/index.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
