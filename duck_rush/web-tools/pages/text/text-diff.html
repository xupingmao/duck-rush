<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本 Diff 对比工具 - Duck Rush Web Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #eef1f6;
            color: #333;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: none;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 20px);
        }

        /* 精简标题栏（取代居中大标题） */
        .app-header {
            padding: 12px 16px;
            background: #34495e;
            color: #ecf0f1;
        }

        .app-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 吸顶工具条 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: #3498db;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: #fff;
        }

        .btn-success:hover {
            background: #229954;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-left: auto;
            align-items: center;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .option-item input {
            cursor: pointer;
        }

        /* 输入区：高度受限，把剩余空间留给结果 */
        .layout {
            display: flex;
            gap: 12px;
            padding: 12px;
            height: clamp(150px, 24vh, 280px);
            flex: 0 0 auto;
        }

        .left-panel,
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title .tag {
            font-size: 12px;
            font-weight: normal;
            padding: 1px 8px;
            border-radius: 10px;
            background: #e9ecef;
            color: #495057;
        }

        textarea.form-control {
            resize: none;
            height: 100%;
            min-height: 0;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: #fafafa;
            line-height: 1.5;
        }

        textarea.form-control:focus {
            outline: none;
            border-color: #3498db;
            background: #fff;
        }

        /* 结果区：占满剩余视口高度并内部滚动 */
        .result-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .summary .badge {
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-added {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-removed {
            background: #fdecea;
            color: #c62828;
        }

        .badge-same {
            background: #e3f2fd;
            color: #1565c0;
        }

        .diff-box {
            flex: 1;
            min-height: 0;
            overflow: auto;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            table-layout: fixed;
        }

        .diff-table td {
            padding: 2px 8px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-table .col-ln {
            width: 48px;
            text-align: right;
            color: #aaa;
            background: #fafafa;
            user-select: none;
            border-right: 1px solid #eee;
        }

        .diff-table .col-sign {
            width: 24px;
            text-align: center;
            color: #aaa;
            user-select: none;
        }

        .row-added {
            background: #e8f5e9;
        }

        .row-added .col-sign {
            color: #2e7d32;
            font-weight: bold;
        }

        .row-removed {
            background: #fdecea;
        }

        .row-removed .col-sign {
            color: #c62828;
            font-weight: bold;
        }

        .empty-hint {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #27ae60;
            color: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }

        .toast.error {
            background: #e74c3c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 错误模态弹窗：不自动消失，方便复制错误信息 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-overlay.hide {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            max-width: 640px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            background: #c62828;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
        }

        .modal-body {
            padding: 16px;
            overflow: auto;
        }

        .modal-message {
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            color: #333;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            margin: 0;
        }

        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
                font-size: 13px;
            }

            .container {
                min-height: calc(100vh - 16px);
            }

            .layout {
                flex-direction: column;
                height: auto;
            }

            textarea.form-control {
                min-height: 160px;
            }

            .options {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>文本 Diff 对比工具</h1>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="compareText()">比较</button>
            <button class="btn btn-secondary" onclick="swapSides()">交换左右</button>
            <button class="btn btn-success" onclick="loadSample()">加载示例</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>

            <div class="options">
                <label class="option-item">
                    <input type="checkbox" id="opt-ignore-space"> 忽略首尾空白
                </label>
                <label class="option-item">
                    <input type="checkbox" id="opt-ignore-case"> 忽略大小写
                </label>
                <label class="option-item">
                    <input type="checkbox" id="opt-only-diff"> 仅显示差异
                </label>
            </div>
        </div>

        <div class="layout">
            <div class="left-panel">
                <div class="panel-title">原始文本 <span class="tag">左侧</span></div>
                <textarea id="text-left" class="form-control" placeholder="请输入原始文本，每行一条内容…"></textarea>
            </div>
            <div class="right-panel">
                <div class="panel-title">修改后文本 <span class="tag">右侧</span></div>
                <textarea id="text-right" class="form-control" placeholder="请输入修改后文本，每行一条内容…"></textarea>
            </div>
        </div>

        <div class="result-section">
            <div class="summary" id="summary"></div>
            <div class="diff-box" id="diffResult">
                <div class="empty-hint">点击「比较」查看两段文本的差异</div>
            </div>
        </div>
    </div>

    <!-- 错误模态弹窗 -->
    <div class="modal-overlay hide" id="errorModal">
        <div class="modal">
            <div class="modal-header">
                <span>出错了</span>
                <button class="modal-close" type="button" onclick="hideErrorModal()">×</button>
            </div>
            <div class="modal-body">
                <pre class="modal-message" id="errorMessage"></pre>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="hideErrorModal()">关闭</button>
                <button class="btn btn-primary" type="button" onclick="copyErrorMessage()">复制错误信息</button>
            </div>
        </div>
    </div>

    <script src="../../../../lib/jsdiff/5.2.0/diff.js"></script>
    <script src="../../js/text-diff-core.js"></script>
    <script>
        function $(id) {
            return document.getElementById(id);
        }

        function getOptions() {
            return {
                ignoreWhitespace: $('opt-ignore-space').checked,
                ignoreCase: $('opt-ignore-case').checked,
                onlyDiff: $('opt-only-diff').checked
            };
        }

        function renderDiff(options) {
            var leftText = $('text-left').value;
            var rightText = $('text-right').value;

            var rows = TextDiffCore.diffText(leftText, rightText, options);

            var added = 0, removed = 0, equal = 0;
            rows.forEach(function (r) {
                if (r.type === 'added') added++;
                else if (r.type === 'removed') removed++;
                else equal++;
            });
            renderSummary(added, removed, equal);

            var box = $('diffResult');
            if (rows.length === 0) {
                box.innerHTML = '<div class="empty-hint">两段文本均为空，没有差异</div>';
                return;
            }

            var table = document.createElement('table');
            table.className = 'diff-table';
            var tbody = document.createElement('tbody');

            rows.forEach(function (r) {
                if (options.onlyDiff && r.type === 'equal') return;
                var tr = document.createElement('tr');
                tr.className = r.type === 'added' ? 'row-added' : (r.type === 'removed' ? 'row-removed' : '');

                var tdLn = document.createElement('td');
                tdLn.className = 'col-ln';
                tdLn.textContent = r.ln === '' ? '' : r.ln;

                var tdSign = document.createElement('td');
                tdSign.className = 'col-sign';
                tdSign.textContent = r.type === 'added' ? '+' : (r.type === 'removed' ? '-' : ' ');

                var tdText = document.createElement('td');
                tdText.textContent = r.type === 'removed' ? r.left : r.right;

                tr.appendChild(tdLn);
                tr.appendChild(tdSign);
                tr.appendChild(tdText);
                tbody.appendChild(tr);
            });

            box.innerHTML = '';
            table.appendChild(tbody);
            box.appendChild(table);
        }

        function renderSummary(added, removed, equal) {
            var box = $('summary');
            var html = '';
            html += '<span class="badge badge-added">新增 ' + added + '</span>';
            html += '<span class="badge badge-removed">删除 ' + removed + '</span>';
            html += '<span class="badge badge-same">相同 ' + equal + '</span>';
            box.innerHTML = html;
        }

        function compareText() {
            var options = getOptions();
            try {
                renderDiff(options);
                showToast('对比完成');
            } catch (error) {
                showErrorModal(error && error.stack ? error.stack : String(error));
            }
        }

        function swapSides() {
            var l = $('text-left').value;
            $('text-left').value = $('text-right').value;
            $('text-right').value = l;
        }

        function loadSample() {
            $('text-left').value = [
                "function hello() {",
                "  console.log('Hello, world!');",
                "  return true;",
                "}",
                "",
                "const version = 1;"
            ].join('\n');
            $('text-right').value = [
                "function hello() {",
                "  console.log('Hello, Duck Rush!');",
                "  return true;",
                "}",
                "",
                "const version = 2;",
                "const author = 'xupin';"
            ].join('\n');
            showToast('已加载示例');
        }

        function clearAll() {
            $('text-left').value = '';
            $('text-right').value = '';
            $('summary').innerHTML = '';
            $('diffResult').innerHTML = '<div class="empty-hint">点击「比较」查看两段文本的差异</div>';
        }

        function showToast(message, type) {
            type = type || 'success';
            var toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function () {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(function () { document.body.removeChild(toast); }, 300);
            }, 2000);
        }

        function showErrorModal(message) {
            $('errorMessage').textContent = message;
            $('errorModal').classList.remove('hide');
        }

        function hideErrorModal() {
            $('errorModal').classList.add('hide');
        }

        function copyErrorMessage() {
            var text = $('errorMessage').textContent;
            var done = function () { showToast('已复制错误信息'); };
            var fail = function () { showToast('复制失败，请手动选择文本', 'error'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, fail);
            } else {
                try {
                    var range = document.createRange();
                    range.selectNode($('errorMessage'));
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    var ok = document.execCommand('copy');
                    sel.removeAllRanges();
                    ok ? done() : fail();
                } catch (e) {
                    fail();
                }
            }
        }

        // 点击遮罩或按 Esc 关闭弹窗
        document.getElementById('errorModal').addEventListener('click', function (e) {
            if (e.target === this) hideErrorModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') hideErrorModal();
        });
    </script>
</body>
</html>
