<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本分割工具 | Duck Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 20px;
            text-align: center;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        main {
            padding: 18px;
        }

        .controls {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            border: 1px solid #e9ecef;
        }

        /* 控制区：一个配置项一行，紧凑排布 */
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 4px 0;
            border-bottom: 1px dashed #e9ecef;
        }

        .control-row.last-row {
            border-bottom: none;
        }

        .row-label {
            flex: 0 0 66px;
            font-weight: 600;
            color: #444;
            font-size: 0.85rem;
        }

        .options {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .custom-input {
            display: none;
        }

        .custom-input input {
            padding: 3px 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 130px;
        }

        /* 分批设置：未启用分批时整块收起，不占版面 */
        .batch-settings {
            display: none;
            margin: 4px 0 6px;
            padding: 6px 10px;
            background: #fff;
            border: 1px solid #e6e9ee;
            border-radius: 6px;
        }

        .batch-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .batch-row:last-child {
            margin-bottom: 0;
        }

        .batch-inline {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .batch-label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 600;
        }

        .num-input {
            padding: 3px 6px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 72px;
        }

        .text-input {
            padding: 3px 6px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 150px;
        }

        .title-format {
            width: 190px;
            font-family: 'Courier New', Courier, monospace;
        }

        .batch-hint {
            font-size: 0.78rem;
            color: #868e96;
        }

        .auto-convert {
            margin-left: auto;
            align-self: center;
        }

        /* 状态栏 */
        .status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            min-height: 34px;
            display: flex;
            align-items: center;
        }

        .status.ok {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .status.err {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .status.idle {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #e9ecef;
        }

        .button-group {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .text-areas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .text-section {
            display: flex;
            flex-direction: column;
        }

        .text-section label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .text-area-container {
            flex: 1;
            min-height: 300px;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .output-section {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 32px;
            right: 8px;
            padding: 4px 8px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #e9ecef;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            main {
                padding: 16px;
            }

            .text-areas {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .text-area-container {
                min-height: 200px;
            }

            .row-label {
                flex: 0 0 auto;
            }

            .options {
                gap: 6px;
            }

            .control-row {
                gap: 6px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 class="header-title">文本分割工具</h1>
            <p class="header-subtitle">将文本按照指定分隔符分割，并使用新的分隔符重新组合；支持分成 N 批分别转换，每批可加标题说明</p>
        </header>

        <main>
            <div class="controls">
                <div class="control-row">
                    <span class="row-label">分割方式</span>
                    <div class="options">
                        <label class="option-item">
                            <input type="radio" name="splitMethod" value="newline" checked><span>换行</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="splitMethod" value="comma"><span>逗号</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="splitMethod" value="space"><span>空格</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="splitMethod" value="custom"><span>自定义</span>
                        </label>
                    </div>
                    <div class="custom-input" id="customSplitInput">
                        <input type="text" id="splitCustomValue" placeholder="自定义分隔符">
                    </div>
                </div>

                <div class="control-row">
                    <span class="row-label">结果分隔</span>
                    <div class="options">
                        <label class="option-item">
                            <input type="radio" name="joinMethod" value="comma" checked><span>逗号</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="joinMethod" value="newline"><span>换行</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="joinMethod" value="space"><span>空格</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="joinMethod" value="custom"><span>自定义</span>
                        </label>
                    </div>
                    <div class="custom-input" id="customJoinInput">
                        <input type="text" id="joinCustomValue" placeholder="自定义分隔符">
                    </div>
                </div>

                <div class="control-row">
                    <span class="row-label">条目处理</span>
                    <div class="options">
                        <label class="option-item">
                            <input type="checkbox" id="trimOption" checked><span>去空白</span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="uniqueOption"><span>去重</span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="sortOption"><span>排序</span>
                        </label>
                    </div>
                    <span class="batch-label">引号</span>
                    <div class="options">
                        <label class="option-item">
                            <input type="radio" name="quoteMethod" value="none" checked><span>不处理</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="quoteMethod" value="single"><span>单引号</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="quoteMethod" value="double"><span>双引号</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="quoteMethod" value="remove"><span>移除</span>
                        </label>
                    </div>
                </div>

                <div class="control-row last-row">
                    <span class="row-label">分批</span>
                    <label class="option-item">
                        <input type="checkbox" id="batchEnabled"><span>启用分批（每批各自转换，输出也是多批）</span>
                    </label>
                </div>

                <div class="batch-settings" id="batchSettings">
                    <div class="batch-row">
                        <span class="batch-label">分配方式</span>
                        <label class="batch-inline">
                            <input type="radio" name="batchMode" value="count" checked>
                            <span>平均分成</span>
                            <input type="number" id="batchCount" class="num-input" min="1" value="2">
                            <span>批</span>
                        </label>
                        <label class="batch-inline">
                            <input type="radio" name="batchMode" value="size">
                            <span>每批最多</span>
                            <input type="number" id="batchSize" class="num-input" min="1" value="100">
                            <span>条</span>
                        </label>
                        <label class="batch-inline">
                            <input type="checkbox" id="batchDropEmpty"><span>丢弃空批次</span>
                        </label>
                    </div>
                    <div class="batch-row">
                        <span class="batch-label">批次分隔</span>
                        <label class="batch-inline">
                            <input type="radio" name="batchSep" value="blankline" checked><span>空行</span>
                        </label>
                        <label class="batch-inline">
                            <input type="radio" name="batchSep" value="newline"><span>换行</span>
                        </label>
                        <label class="batch-inline">
                            <input type="radio" name="batchSep" value="custom"><span>自定义</span>
                        </label>
                        <input type="text" id="batchCustomSep" class="text-input" placeholder="自定义批次分隔符">
                        <label class="batch-inline">
                            <input type="checkbox" id="batchTitle"><span>每批加标题</span>
                        </label>
                        <input type="text" id="batchTitleFormat" class="text-input title-format"
                               value="第 {n} 批（共 {total} 批）">
                    </div>
                    <div class="batch-hint">标题支持 {n} 批号、{total} 总批数、{size} 本批条数；去重与排序在每批内部独立生效</div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" id="splitBtn">分割文本</button>
                    <button class="btn btn-secondary" id="clearBtn">清空</button>
                    <label class="batch-inline auto-convert">
                        <input type="checkbox" id="autoConvert" checked>
                        <span>输入时自动转换</span>
                    </label>
                </div>
            </div>

            <div class="text-areas">
                <div class="text-section">
                    <label for="inputText">输入文本</label>
                    <div class="text-area-container">
                        <textarea id="inputText" placeholder="请输入要分割的文本..."></textarea>
                    </div>
                </div>

                <div class="text-section output-section">
                    <label for="outputText">输出结果</label>
                    <button class="copy-btn" id="copyBtn">复制结果</button>
                    <div class="text-area-container">
                        <textarea id="outputText" placeholder="分割结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
            </div>

            <div class="status idle" id="statusBar">就绪</div>
        </main>
    </div>

    <script>
        // DOM 元素
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const splitBtn = document.getElementById('splitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const splitMethodRadios = document.querySelectorAll('input[name="splitMethod"]');
        const joinMethodRadios = document.querySelectorAll('input[name="joinMethod"]');
        const quoteMethodRadios = document.querySelectorAll('input[name="quoteMethod"]');
        const customSplitInput = document.getElementById('customSplitInput');
        const customJoinInput = document.getElementById('customJoinInput');
        const splitCustomValue = document.getElementById('splitCustomValue');
        const joinCustomValue = document.getElementById('joinCustomValue');
        const trimOption = document.getElementById('trimOption');
        const sortOption = document.getElementById('sortOption');
        const uniqueOption = document.getElementById('uniqueOption');
        const statusBar = document.getElementById('statusBar');
        const batchEnabled = document.getElementById('batchEnabled');
        const batchSettings = document.getElementById('batchSettings');
        const batchCount = document.getElementById('batchCount');
        const batchSize = document.getElementById('batchSize');
        const batchCustomSep = document.getElementById('batchCustomSep');
        const batchDropEmpty = document.getElementById('batchDropEmpty');
        const batchTitle = document.getElementById('batchTitle');
        const batchTitleFormat = document.getElementById('batchTitleFormat');
        const autoConvert = document.getElementById('autoConvert');

        // 预设分隔符
        const SEPARATORS = { comma: ',', newline: '\n', space: ' ' };

        function setStatus(msg, kind) {
            statusBar.textContent = msg;
            statusBar.className = 'status ' + (kind || 'idle');
        }

        // 初始化
        function init() {
            // 隐藏自定义输入框
            updateCustomInputs();
            updateBatchSettings();

            // 事件监听器
            splitBtn.addEventListener('click', splitText);
            clearBtn.addEventListener('click', clearText);
            copyBtn.addEventListener('click', copyResult);

            // 监听分割方法变化
            splitMethodRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    updateCustomInputs();
                    splitText();
                });
            });

            // 监听结果分隔符变化
            joinMethodRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    updateCustomInputs();
                    splitText();
                });
            });

            // 自定义分隔符：打字时即时生效（否则要失焦才更新）
            [splitCustomValue, joinCustomValue].forEach(el => {
                el.addEventListener('input', splitText);
            });

            // 引号处理变化
            quoteMethodRadios.forEach(radio => {
                radio.addEventListener('change', splitText);
            });

            // 高级选项变化
            [trimOption, sortOption, uniqueOption].forEach(el => {
                el.addEventListener('change', splitText);
            });

            // 分批相关
            batchEnabled.addEventListener('change', () => {
                updateBatchSettings();
                splitText();
            });
            document.querySelectorAll('input[name="batchMode"], input[name="batchSep"]')
                .forEach(el => el.addEventListener('change', splitText));
            [batchCount, batchSize, batchCustomSep, batchDropEmpty, batchTitle, batchTitleFormat].forEach(el => {
                el.addEventListener('input', splitText);
                el.addEventListener('change', splitText);
            });

            // 输入时自动转换（防抖）
            inputText.addEventListener('input', () => {
                if (!autoConvert.checked) return;
                clearTimeout(convertTimer);
                convertTimer = setTimeout(splitText, 150);
            });
        }

        let convertTimer = null;

        // 更新自定义输入框显示状态
        function updateCustomInputs() {
            const splitMethod = getSelectedValue('splitMethod');
            const joinMethod = getSelectedValue('joinMethod');

            customSplitInput.style.display = splitMethod === 'custom' ? 'inline-block' : 'none';
            customJoinInput.style.display = joinMethod === 'custom' ? 'inline-block' : 'none';
        }

        // 分批设置仅在启用时展开，未启用时不占版面
        function updateBatchSettings() {
            batchSettings.style.display = batchEnabled.checked ? 'block' : 'none';
        }

        // 获取选中的单选按钮值
        function getSelectedValue(name) {
            const radio = document.querySelector(`input[name="${name}"]:checked`);
            return radio ? radio.value : '';
        }

        /** 读取分隔符；返回 null 表示用户未填写自定义值 */
        function readSeparator(methodName, customEl) {
            const method = getSelectedValue(methodName);
            if (method === 'custom') {
                return customEl.value || null;
            }
            return SEPARATORS[method];
        }

        /**
         * 对一批条目执行转换（去空白 → 去重 → 去引号 → 排序 → 加引号）
         * @param {string[]} parts
         * @returns {string[]}
         */
        function processParts(parts) {
            let result = parts;
            if (trimOption.checked) result = result.map(p => p.trim());
            if (uniqueOption.checked) result = [...new Set(result)];

            const quoteMethod = getSelectedValue('quoteMethod');
            if (quoteMethod === 'remove') {
                result = result.map(p => p.replace(/^['"]|['"]$/g, ''));
            }
            if (sortOption.checked) result.sort();
            if (quoteMethod === 'single') result = result.map(p => `'${p}'`);
            else if (quoteMethod === 'double') result = result.map(p => `"${p}"`);
            return result;
        }

        /**
         * 把条目分成多批
         * @param {string[]} parts 条目列表
         * @param {'count'|'size'} mode 分配方式
         * @returns {string[][]} 批次列表
         */
        function splitIntoBatches(parts, mode) {
            const total = parts.length;
            if (total === 0) return [];

            if (mode === 'size') {
                const size = Math.max(1, parseInt(batchSize.value, 10) || 1);
                const batches = [];
                for (let i = 0; i < total; i += size) {
                    batches.push(parts.slice(i, i + size));
                }
                return batches;
            }

            // 平均分成 N 批：前 (total % n) 批各多 1 条，保证尽量均匀
            const requested = Math.max(1, parseInt(batchCount.value, 10) || 1);
            const n = Math.min(requested, total); // 批数不能超过条目数
            const base = Math.floor(total / n);
            const remainder = total % n;
            const batches = [];
            let cursor = 0;
            for (let i = 0; i < n; i++) {
                const len = base + (i < remainder ? 1 : 0);
                batches.push(parts.slice(cursor, cursor + len));
                cursor += len;
            }
            return batches;
        }

        /** 批次之间的分隔符；自定义未填写时返回 null */
        function readBatchSeparator() {
            const kind = getSelectedValue('batchSep');
            if (kind === 'newline') return '\n';
            if (kind === 'custom') return batchCustomSep.value || null;
            return '\n\n'; // 'blankline'
        }

        /**
         * 生成批次标题，默认形如 "第 1 批（共 3 批）"
         * 支持占位符：{n} 批号、{total} 总批数、{size} 本批条数
         */
        function renderBatchTitle(index, total, size) {
            const tpl = (batchTitleFormat.value || '').trim() || '第 {n} 批（共 {total} 批）';
            return tpl
                .replace(/\{n\}/g, String(index))
                .replace(/\{total\}/g, String(total))
                .replace(/\{size\}/g, String(size));
        }

        // 分割文本
        function splitText() {
            const text = inputText.value;

            // 空输入：清空输出而不是弹窗打断
            if (!text.trim()) {
                outputText.value = '';
                setStatus('就绪', 'idle');
                return;
            }

            const separator = readSeparator('splitMethod', splitCustomValue);
            if (separator === null) {
                setStatus('请填写自定义分割分隔符', 'err');
                return;
            }
            const joinSeparator = readSeparator('joinMethod', joinCustomValue);
            if (joinSeparator === null) {
                setStatus('请填写自定义结果分隔符', 'err');
                return;
            }

            // 分割并过滤空条目
            let parts = text.split(separator).filter(part => part.trim() !== '');
            if (parts.length === 0) {
                outputText.value = '';
                setStatus('未解析出任何有效条目', 'err');
                return;
            }

            // ---- 未启用分批：保持原有行为 ----
            if (!batchEnabled.checked) {
                const result = processParts(parts).join(joinSeparator);
                outputText.value = result;
                setStatus(`共 ${parts.length} 个条目`, 'ok');
                return;
            }

            // ---- 启用分批：每批独立转换 ----
            const mode = getSelectedValue('batchMode');
            let batches = splitIntoBatches(parts, mode);
            let batchTexts = batches.map(b => processParts(b).join(joinSeparator));

            if (batchDropEmpty.checked) {
                const keptBatches = [];
                const keptTexts = [];
                for (let i = 0; i < batchTexts.length; i++) {
                    if (batchTexts[i].trim() !== '') {
                        keptBatches.push(batches[i]);
                        keptTexts.push(batchTexts[i]);
                    }
                }
                batches = keptBatches;
                batchTexts = keptTexts;
            }

            if (batchTexts.length === 0) {
                outputText.value = '';
                setStatus('丢弃空批次后没有任何内容', 'err');
                return;
            }

            // 每批开头加上批次标题，方便识别（与批次分隔方式互不干扰）
            if (batchTitle.checked) {
                const total = batchTexts.length;
                batchTexts = batchTexts.map((t, i) =>
                    `${renderBatchTitle(i + 1, total, batches[i].length)}\n${t}`);
            }

            const batchSep = readBatchSeparator();
            if (batchSep === null) {
                setStatus('请填写自定义批次分隔符', 'err');
                return;
            }
            outputText.value = batchTexts.join(batchSep);

            const sizes = batches.map(b => b.length);
            const min = Math.min(...sizes);
            const max = Math.max(...sizes);
            const sizeDesc = min === max ? `每批 ${max} 条` : `每批 ${min}~${max} 条`;
            setStatus(`共 ${parts.length} 个条目，分成 ${batches.length} 批（${sizeDesc}）`, 'ok');
        }

        // 清空文本
        function clearText() {
            inputText.value = '';
            outputText.value = '';
            setStatus('已清空', 'idle');
        }

        // 复制结果
        function copyResult() {
            if (!outputText.value.trim()) {
                setStatus('没有可复制的内容', 'err');
                return;
            }

            const done = () => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1000);
                setStatus('已复制到剪贴板', 'ok');
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(done, () => {
                    legacyCopy() ? done() : setStatus('复制失败，请手动选中复制', 'err');
                });
            } else {
                legacyCopy() ? done() : setStatus('复制失败，请手动选中复制', 'err');
            }
        }

        /** file:// 场景下的兜底复制 */
        function legacyCopy() {
            try {
                const prev = outputText.readOnly;
                outputText.readOnly = false;
                outputText.select();
                outputText.setSelectionRange(0, 999999);
                const ok = document.execCommand('copy');
                outputText.readOnly = prev;
                return ok;
            } catch (e) {
                return false;
            }
        }

        // 初始化
        init();
    </script>
</body>

</html>
