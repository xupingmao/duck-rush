<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell文本处理 | Duck Rush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        main { padding: 24px; }

        .command-bar {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .command-bar label {
            color: #6a9955;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .command-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background: #252526;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .command-bar input:focus {
            border-color: #6a9955;
        }

        .command-bar input::placeholder {
            color: #6a9955;
            opacity: 0.5;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6a9955 0%, #4ec9b0 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(106, 153, 85, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .text-areas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .text-section {
            display: flex;
            flex-direction: column;
        }

        .text-section label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .text-section label .status {
            font-weight: 400;
            font-size: 0.8rem;
            color: #999;
        }

        .text-section label .status.running {
            color: #e67e22;
        }

        .text-section label .status.done {
            color: #27ae60;
        }

        .text-section label .status.error {
            color: #e74c3c;
        }

        .text-area-container {
            flex: 1;
            min-height: 350px;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            tab-size: 4;
        }

        textarea:focus {
            outline: none;
            border-color: #6a9955;
            box-shadow: 0 0 0 0.2rem rgba(106, 153, 85, 0.25);
        }

        textarea[readonly] {
            background: #f8f9fa;
        }

        .output-section {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 32px;
            right: 8px;
            padding: 4px 8px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #e9ecef;
        }

        .help-section {
            margin-top: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
        }

        .help-section summary {
            cursor: pointer;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
            padding: 4px 0;
        }

        .help-section .help-content {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
        }

        .help-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
        }

        .help-card code {
            display: block;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
        }

        .help-card p {
            font-size: 0.8rem;
            color: #666;
        }

        .help-note {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #666;
            line-height: 1.7;
        }

        .help-note code {
            background: #1e1e1e;
            color: #9cdcfe;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
        }

        @media (max-width: 768px) {
            body { padding: 8px; }
            main { padding: 16px; }
            .text-areas {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .text-area-container { min-height: 200px; }
            .command-bar { flex-direction: column; }
            .command-bar input { width: 100%; min-width: unset; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="header-title">⌨ Shell文本处理</h1>
            <p class="header-subtitle">用 Shell 命令处理文本 — 输入 → 管道 → 输出（纯前端模拟，不依赖服务端）</p>
        </header>

        <main>
            <div class="command-bar">
                <label>$</label>
                <input type="text" id="shellCommand" placeholder="例如: sort -u | head -5" spellcheck="false" autofocus>
                <button class="btn btn-primary" id="runBtn">▶ 运行</button>
                <button class="btn btn-secondary" id="clearBtn">清空</button>
            </div>

            <div class="text-areas">
                <div class="text-section">
                    <label for="inputText">
                        <span>输入文本</span>
                        <span class="status" id="inputStatus"></span>
                    </label>
                    <div class="text-area-container">
                        <textarea id="inputText" placeholder="在此粘贴要处理的文本..."></textarea>
                    </div>
                </div>

                <div class="text-section output-section">
                    <label for="outputText">
                        <span>输出结果</span>
                        <span class="status" id="outputStatus"></span>
                    </label>
                    <button class="copy-btn" id="copyBtn">复制</button>
                    <div class="text-area-container">
                        <textarea id="outputText" placeholder="结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
            </div>

            <div class="help-section">
                <details open>
                    <summary>📖 命令速查（<span id="cmdCount">0</span> 个，点击折叠）</summary>
                    <div class="help-content" id="helpContent"></div>
                    <div class="help-note">
                        命令由 <code>TextShell.register(name, ctx =&gt; {...})</code> 注册，
                        ctx 内含管道：<code>ctx.lines</code> 读上游、<code>ctx.pipe.write()</code> 写下游，
                        也可直接 <code>return</code> 字符串或行数组。
                    </div>
                </details>
            </div>
        </main>
    </div>

    <script src="../../js/text-shell.js"></script>
    <script>
        // 页面级自定义命令：演示如何用 TextShell.register 扩展命令表
        TextShell.register('upper', function (ctx) {
            ctx.pipe.write(ctx.lines.map(function (l) { return l.toUpperCase(); }));
        }, { usage: 'upper', desc: '整行转大写（页面注册的示例命令）' });

        TextShell.register('len', function (ctx) {
            ctx.pipe.write(ctx.lines.map(function (l) { return l.length + ' ' + l; }));
        }, { usage: 'len', desc: '在每行前加上长度（页面注册的示例命令）' });

        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const shellCommand = document.getElementById('shellCommand');
        const runBtn = document.getElementById('runBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const inputStatus = document.getElementById('inputStatus');
        const outputStatus = document.getElementById('outputStatus');
        const helpContent = document.getElementById('helpContent');
        const cmdCount = document.getElementById('cmdCount');

        runBtn.addEventListener('click', runCommand);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyResult);

        shellCommand.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                runCommand();
            }
        });

        renderHelp();

        /** 按命令注册表渲染帮助卡片 */
        function renderHelp() {
            const commands = TextShell.list();
            cmdCount.textContent = commands.length;
            helpContent.innerHTML = commands.map(function (c) {
                return '<div class="help-card"><code></code><p></p></div>';
            }).join('');

            const cards = helpContent.querySelectorAll('.help-card');
            commands.forEach(function (c, i) {
                cards[i].querySelector('code').textContent = c.usage;
                cards[i].querySelector('p').textContent = c.desc;
            });
        }

        function setStatus(el, text, type) {
            el.textContent = text;
            el.className = 'status' + (type ? ' ' + type : '');
        }

        function runCommand() {
            const text = inputText.value;
            const cmd = shellCommand.value.trim();

            if (!text) {
                setStatus(outputStatus, '⚠ 输入为空', 'error');
                return;
            }
            if (!cmd) {
                setStatus(outputStatus, '⚠ 请输入命令', 'error');
                return;
            }

            const started = performance.now();
            const result = TextShell.run(cmd, text);

            if (result.error) {
                outputText.value = '';
                setStatus(outputStatus, '✗ ' + result.error, 'error');
                setStatus(inputStatus, '', '');
                return;
            }

            outputText.value = result.output;
            const cost = (performance.now() - started).toFixed(1);
            let info = '✓ ' + result.commands.length + ' 个命令 · ' + cost + 'ms';
            if (result.log.length) info += ' · ' + result.log.length + ' 条诊断';
            setStatus(inputStatus, '✓ 就绪', 'done');
            setStatus(outputStatus, info, 'done');
        }

        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            shellCommand.value = '';
            setStatus(inputStatus, '', '');
            setStatus(outputStatus, '', '');
        }

        function copyResult() {
            if (!outputText.value) {
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(function() {
                    var orig = copyBtn.textContent;
                    copyBtn.textContent = '✓ 已复制';
                    setTimeout(function() { copyBtn.textContent = orig; }, 1000);
                });
            } else {
                outputText.select();
                document.execCommand('copy');
                var orig = copyBtn.textContent;
                copyBtn.textContent = '✓ 已复制';
                setTimeout(function() { copyBtn.textContent = orig; }, 1000);
            }
        }
    </script>
</body>
</html>
