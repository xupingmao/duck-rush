<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素编辑器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 16px; color: #333; }
h1 { text-align: center; margin-bottom: 16px; font-size: 22px; }
.container { max-width: 1100px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }

/* 左侧工具栏 */
.panel { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); width: 280px; }
.panel h2 { font-size: 14px; color: #555; margin: 16px 0 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
.panel h2:first-child { margin-top: 0; }

.field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
.field label { width: 56px; color: #666; flex-shrink: 0; }
.field input[type="number"] { width: 70px; padding: 5px; border: 1px solid #ccc; border-radius: 6px; }
.field input[type="range"] { flex: 1; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 7px 14px; border: none; border-radius: 8px; background: #4a90d9; color: #fff; font-size: 13px; cursor: pointer; transition: background .2s; }
.btn:hover { background: #357abd; }
.btn:active { background: #2a6aa8; }
.btn.ghost { background: #ecf0f1; color: #333; }
.btn.ghost:hover { background: #dfe6e9; }
.btn.danger { background: #e74c3c; }
.btn.danger:hover { background: #c0392b; }
.btn.active { background: #2c3e50; }

.color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
#colorPicker { width: 48px; height: 36px; border: none; border-radius: 6px; background: none; cursor: pointer; padding: 0; }
.swatch-current { width: 36px; height: 36px; border-radius: 6px; border: 1px solid #ccc; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.palette .pc { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,.1); }
.recent { display: flex; flex-wrap: wrap; gap: 6px; }
.recent .rc { width: 18px; height: 18px; border-radius: 3px; cursor: pointer; border: 1px solid rgba(0,0,0,.1); }

.tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

/* 右侧画布区 */
.stage { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center; }
.canvas-wrap { overflow: auto; max-width: 100%; max-height: 70vh; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
#pixelCanvas { display: block; cursor: crosshair; image-rendering: pixelated; touch-action: none; }
.coord-bar { margin-top: 12px; font-size: 13px; color: #666; display: flex; gap: 16px; align-items: center; }
.coord-bar .dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; display: inline-block; vertical-align: middle; }
.hint { font-size: 12px; color: #999; margin-top: 8px; text-align: center; }

@media (max-width: 760px) {
  .panel { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
  <!-- 左侧控制面板 -->
  <div class="panel">
    <h2>画布尺寸</h2>
    <div class="field">
      <label>宽(列)</label>
      <input type="number" id="colsInput" min="1" max="128" value="16">
      <label>高(行)</label>
      <input type="number" id="rowsInput" min="1" max="128" value="16">
    </div>
    <div class="row">
      <button class="btn" id="resizeBtn">应用尺寸</button>
      <button class="btn ghost" data-preset="8,8">8×8</button>
      <button class="btn ghost" data-preset="16,16">16×16</button>
      <button class="btn ghost" data-preset="32,32">32×32</button>
    </div>

    <h2>缩放</h2>
    <div class="field">
      <label>像素格</label>
      <input type="range" id="cellRange" min="4" max="40" value="20">
      <span id="cellVal">20px</span>
    </div>

    <h2>颜色</h2>
    <div class="color-row">
      <input type="color" id="colorPicker" value="#4a90d9">
      <div class="swatch-current" id="currentSwatch"></div>
      <span style="font-size:12px;color:#999">当前色</span>
    </div>
    <div class="palette" id="palette"></div>
    <div style="font-size:12px;color:#666;margin-bottom:4px;">最近使用</div>
    <div class="recent" id="recentColors"></div>

    <h2>工具</h2>
    <div class="tools">
      <button class="btn active" data-tool="pencil">✏️ 铅笔</button>
      <button class="btn" data-tool="eraser">🧽 橡皮</button>
      <button class="btn" data-tool="fill">🪣 填充</button>
      <button class="btn" data-tool="picker">💉 取色</button>
    </div>

    <h2>操作</h2>
    <div class="row" style="margin-bottom:8px;">
      <button class="btn ghost" id="undoBtn">↶ 撤销</button>
      <button class="btn ghost" id="redoBtn">↷ 重做</button>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
        <input type="checkbox" id="gridChk" checked> 显示网格
      </label>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <button class="btn danger" id="clearBtn">清空画布</button>
    </div>

    <h2>导入 / 导出</h2>
    <div class="row">
      <button class="btn ghost" id="exportPngBtn">导出 PNG</button>
      <button class="btn ghost" id="exportJsonBtn">导出 JSON</button>
      <button class="btn ghost" id="importJsonBtn">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    </div>
  </div>

  <!-- 右侧画布 -->
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="pixelCanvas"></canvas>
    </div>
    <div class="coord-bar">
      <span>坐标: <strong id="coordText">-</strong></span>
      <span>当前色: <span class="dot" id="coordDot"></span></span>
    </div>
    <div class="hint">在画布上拖动可连续绘制 · 支持触摸操作</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ── 状态 ──
  var MAX_DIM = 128;
  var state = {
    cols: 16,
    rows: 16,
    cell: 20,
    color: "#4a90d9",
    tool: "pencil",
    showGrid: true,
    pixels: []          // 长度 cols*rows，存颜色字符串或 null(透明)
  };
  var undoStack = [];
  var redoStack = [];
  var recentColors = [];
  var PRESET_PALETTE = [
    "#000000", "#ffffff", "#e74c3c", "#e67e22", "#f1c40f", "#2ecc71",
    "#1abc9c", "#3498db", "#4a90d9", "#9b59b6", "#ec407a", "#795548",
    "#95a5a6", "#34495e", "#ff7979", "#badc58"
  ];

  var canvas = document.getElementById("pixelCanvas");
  var ctx = canvas.getContext("2d");

  // ── 工具函数 ──
  function idx(x, y) { return y * state.cols + x; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < state.cols && y < state.rows; }

  function pushUndo() {
    undoStack.push(state.pixels.slice());
    if (undoStack.length > 60) undoStack.shift();
    redoStack.length = 0;
  }

  function snapshot() { return state.pixels.slice(); }

  // ── 渲染 ──
  function resizeCanvas() {
    canvas.width = state.cols * state.cell;
    canvas.height = state.rows * state.cell;
    draw();
  }

  function drawChecker(x, y, w, h) {
    var s = state.cell / 2;
    ctx.fillStyle = "#e9e9e9";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#ffffff";
    for (var gy = 0; gy < h; gy += s) {
      for (var gx = 0; gx < w; gx += s) {
        if (((gx / s) + (gy / s)) % 2 === 0) ctx.fillRect(x + gx, y + gy, s, s);
      }
    }
  }

  function draw() {
    var w = canvas.width, h = canvas.height;
    drawChecker(0, 0, w, h);
    for (var y = 0; y < state.rows; y++) {
      for (var x = 0; x < state.cols; x++) {
        var c = state.pixels[idx(x, y)];
        if (c) {
          ctx.fillStyle = c;
          ctx.fillRect(x * state.cell, y * state.cell, state.cell, state.cell);
        }
      }
    }
    if (state.showGrid && state.cell >= 6) {
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var i = 0; i <= state.cols; i++) {
        ctx.moveTo(i * state.cell + 0.5, 0);
        ctx.lineTo(i * state.cell + 0.5, h);
      }
      for (var j = 0; j <= state.rows; j++) {
        ctx.moveTo(0, j * state.cell + 0.5);
        ctx.lineTo(w, j * state.cell + 0.5);
      }
      ctx.stroke();
    }
  }

  // ── 绘制操作 ──
  function paintCell(x, y) {
    if (!inBounds(x, y)) return;
    var i = idx(x, y);
    var val = state.tool === "eraser" ? null : state.color;
    if (state.pixels[i] === val) return;
    state.pixels[i] = val;
    draw();
  }

  function floodFill(sx, sy) {
    if (!inBounds(sx, sy)) return;
    var target = state.pixels[idx(sx, sy)];
    var repl = state.tool === "eraser" ? null : state.color;
    if (target === repl) return;
    var stack = [[sx, sy]];
    while (stack.length) {
      var p = stack.pop();
      var x = p[0], y = p[1];
      if (!inBounds(x, y)) continue;
      var i = idx(x, y);
      if (state.pixels[i] !== target) continue;
      state.pixels[i] = repl;
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    draw();
  }

  function pickColor(x, y) {
    if (!inBounds(x, y)) return;
    var c = state.pixels[idx(x, y)];
    if (c) {
      state.color = c;
      document.getElementById("colorPicker").value = c;
      updateCurrentSwatch();
    }
  }

  // ── 鼠标 / 触摸 ──
  var drawing = false;

  function eventToCell(ev) {
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (ev.touches && ev.touches.length) {
      cx = ev.touches[0].clientX - rect.left;
      cy = ev.touches[0].clientY - rect.top;
    } else {
      cx = ev.clientX - rect.left;
      cy = ev.clientY - rect.top;
    }
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    return {
      x: Math.floor(cx * scaleX / state.cell),
      y: Math.floor(cy * scaleY / state.cell)
    };
  }

  function onDown(ev) {
    ev.preventDefault();
    var p = eventToCell(ev);
    if (state.tool === "picker") { pickColor(p.x, p.y); return; }
    pushUndo();
    drawing = true;
    if (state.tool === "fill") { floodFill(p.x, p.y); drawing = false; }
    else { paintCell(p.x, p.y); }
    updateCoord(p);
  }

  function onMove(ev) {
    var p = eventToCell(ev);
    updateCoord(p);
    if (!drawing) return;
    ev.preventDefault();
    if (state.tool === "pencil" || state.tool === "eraser") paintCell(p.x, p.y);
  }

  function onUp() { drawing = false; }

  function updateCoord(p) {
    var txt = inBounds(p.x, p.y) ? (p.x + ", " + p.y) : "-";
    document.getElementById("coordText").textContent = txt;
    var c = inBounds(p.x, p.y) ? state.pixels[idx(p.x, p.y)] : null;
    document.getElementById("coordDot").style.background = c || "transparent";
  }

  // ── UI 渲染 ──
  function updateCurrentSwatch() {
    document.getElementById("currentSwatch").style.background = state.color;
  }

  function renderPalette() {
    var el = document.getElementById("palette");
    el.innerHTML = "";
    PRESET_PALETTE.forEach(function (c) {
      var d = document.createElement("div");
      d.className = "pc";
      d.style.background = c;
      d.title = c;
      d.onclick = function () {
        state.color = c;
        document.getElementById("colorPicker").value = c;
        updateCurrentSwatch();
      };
      el.appendChild(d);
    });
  }

  function renderRecent() {
    var el = document.getElementById("recentColors");
    el.innerHTML = "";
    recentColors.forEach(function (c) {
      var d = document.createElement("div");
      d.className = "rc";
      d.style.background = c;
      d.title = c;
      d.onclick = function () {
        state.color = c;
        document.getElementById("colorPicker").value = c;
        updateCurrentSwatch();
      };
      el.appendChild(d);
    });
  }

  function addRecent(c) {
    c = c.toLowerCase();
    var i = recentColors.indexOf(c);
    if (i >= 0) recentColors.splice(i, 1);
    recentColors.unshift(c);
    if (recentColors.length > 16) recentColors.pop();
    renderRecent();
  }

  // ── 尺寸 / 重置 ──
  function applySize(cols, rows) {
    cols = Math.max(1, Math.min(MAX_DIM, cols | 0));
    rows = Math.max(1, Math.min(MAX_DIM, rows | 0));
    state.cols = cols;
    state.rows = rows;
    state.pixels = new Array(cols * rows).fill(null);
    document.getElementById("colsInput").value = cols;
    document.getElementById("rowsInput").value = rows;
    undoStack.length = 0;
    redoStack.length = 0;
    resizeCanvas();
  }

  // ── 导入 / 导出 ──
  function exportPng() {
    var out = document.createElement("canvas");
    out.width = state.cols;
    out.height = state.rows;
    var octx = out.getContext("2d");
    for (var y = 0; y < state.rows; y++) {
      for (var x = 0; x < state.cols; x++) {
        var c = state.pixels[idx(x, y)];
        if (c) { octx.fillStyle = c; octx.fillRect(x, y, 1, 1); }
      }
    }
    var link = document.createElement("a");
    link.download = "pixel-" + state.cols + "x" + state.rows + ".png";
    link.href = out.toDataURL("image/png");
    link.click();
  }

  function exportJson() {
    var data = {
      cols: state.cols,
      rows: state.rows,
      pixels: state.pixels
    };
    var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    var link = document.createElement("a");
    link.download = "pixel-" + state.cols + "x" + state.rows + ".json";
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  }

  function importJson(text) {
    try {
      var data = JSON.parse(text);
      if (!data || !Array.isArray(data.pixels) || !data.cols || !data.rows) {
        alert("JSON 格式无效：缺少 cols/rows/pixels 字段");
        return;
      }
      if (data.pixels.length !== data.cols * data.rows) {
        alert("JSON 格式无效：像素数量与尺寸不匹配");
        return;
      }
      state.cols = data.cols;
      state.rows = data.rows;
      state.pixels = data.pixels.slice();
      document.getElementById("colsInput").value = data.cols;
      document.getElementById("rowsInput").value = data.rows;
      undoStack.length = 0;
      redoStack.length = 0;
      resizeCanvas();
    } catch (e) {
      alert("解析失败：" + e.message);
    }
  }

  // ── 事件绑定 ──
  function bind() {
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    canvas.addEventListener("mouseleave", function () { document.getElementById("coordText").textContent = "-"; });
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp);

    document.getElementById("colorPicker").addEventListener("input", function (e) {
      state.color = e.target.value;
      updateCurrentSwatch();
      addRecent(state.color);
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (b) {
      b.addEventListener("click", function () {
        state.tool = b.getAttribute("data-tool");
        Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (x) {
          x.classList.toggle("active", x === b);
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (b) {
      b.addEventListener("click", function () {
        var parts = b.getAttribute("data-preset").split(",");
        applySize(parseInt(parts[0], 10), parseInt(parts[1], 10));
      });
    });

    document.getElementById("resizeBtn").addEventListener("click", function () {
      applySize(
        parseInt(document.getElementById("colsInput").value, 10),
        parseInt(document.getElementById("rowsInput").value, 10)
      );
    });

    document.getElementById("cellRange").addEventListener("input", function (e) {
      state.cell = parseInt(e.target.value, 10);
      document.getElementById("cellVal").textContent = state.cell + "px";
      resizeCanvas();
    });

    document.getElementById("gridChk").addEventListener("change", function (e) {
      state.showGrid = e.target.checked;
      draw();
    });

    document.getElementById("undoBtn").addEventListener("click", function () {
      if (!undoStack.length) return;
      redoStack.push(snapshot());
      state.pixels = undoStack.pop();
      draw();
    });

    document.getElementById("redoBtn").addEventListener("click", function () {
      if (!redoStack.length) return;
      undoStack.push(snapshot());
      state.pixels = redoStack.pop();
      draw();
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      if (state.pixels.some(function (p) { return p; })) pushUndo();
      state.pixels = new Array(state.cols * state.rows).fill(null);
      draw();
    });

    document.getElementById("exportPngBtn").addEventListener("click", exportPng);
    document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
    document.getElementById("importJsonBtn").addEventListener("click", function () {
      document.getElementById("importFile").click();
    });
    document.getElementById("importFile").addEventListener("change", function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { importJson(reader.result); };
      reader.readAsText(f);
      e.target.value = "";
    });

    // 键盘快捷键
    window.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT") return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) {
        document.getElementById("undoBtn").click();
      } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) {
        document.getElementById("redoBtn").click();
      } else if (e.key.toLowerCase() === "b") {
        document.querySelector('[data-tool="pencil"]').click();
      } else if (e.key.toLowerCase() === "e") {
        document.querySelector('[data-tool="eraser"]').click();
      } else if (e.key.toLowerCase() === "g") {
        document.querySelector('[data-tool="fill"]').click();
      } else if (e.key.toLowerCase() === "i") {
        document.querySelector('[data-tool="picker"]').click();
      }
    });
  }

  // ── 初始化 ──
  function init() {
    state.pixels = new Array(state.cols * state.rows).fill(null);
    updateCurrentSwatch();
    renderPalette();
    renderRecent();
    resizeCanvas();
    bind();
  }

  init();
})();
</script>
</body>
</html>
