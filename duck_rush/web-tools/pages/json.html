<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 工具 | Duck Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }

        main {
            padding: 32px;
        }

        .controls-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e9ecef;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .jsonpath-input {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }

        .jsonpath-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .buttons-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .path-tip {
            font-size: 0.78rem;
            color: #868e96;
        }

        .usage-tip {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #6c757d;
        }

        .usage-tip code {
            background: #fff;
            border: 1px solid #e3e6ea;
            border-radius: 3px;
            padding: 1px 5px;
            margin-right: 4px;
            font-family: 'Courier New', monospace;
            color: #495057;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .textareas-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .textarea-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .textarea-label {
            font-weight: 600;
            color: #444;
        }

        .textarea-wrapper {
            position: relative;
            flex: 1;
        }

        .json-textarea {
            width: 100%;
            height: 400px;
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            resize: vertical;
            background: #f8f9fa;
        }

        .json-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .output-textarea {
            background: #f0f4f8;
        }

        .status-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #e9ecef;
        }

        .status-message {
            font-size: 0.9rem;
            color: #666;
        }

        .status-error {
            color: #dc3545;
        }

        .status-success {
            color: #28a745;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            header {
                padding: 24px;
            }

            .header-title {
                font-size: 1.6rem;
            }

            main {
                padding: 16px;
            }

            .textareas-section {
                grid-template-columns: 1fr;
            }

            .json-textarea {
                height: 300px;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .buttons-group {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }

        /* JSON 语法高亮 */
        .json-key {
            color: #0066cc;
        }

        .json-string {
            color: #008800;
        }

        .json-number {
            color: #ff6600;
        }

        .json-boolean {
            color: #cc0066;
        }

        .json-null {
            color: #888888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="header-title">JSON 工具</h1>
            <p class="header-subtitle">格式化 / 美化 JSON，并按路径表达式提取指定属性</p>
        </header>

        <main>
            <section class="controls-section">
                <div class="controls-grid">
                    <div class="control-group">
                        <label class="control-label" for="jsonpathInput">路径表达式（点击「提取属性」时使用）</label>
                        <input type="text" id="jsonpathInput" class="jsonpath-input"
                               placeholder="例如: $.name、data.users[0].age、data.users[*].name">
                        <div class="path-tip">支持 $.a.b / a.b / a[0] / * 通配 / name:正则；命中多个值时结果以数组输出</div>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" id="formatBtn">格式化</button>
                        <button class="btn btn-primary" id="extractBtn">提取属性</button>
                        <button class="btn btn-secondary" id="tidyBtn">美化输入</button>
                        <button class="btn btn-secondary" id="copyBtn">复制结果</button>
                        <button class="btn btn-secondary" id="clearBtn">清空</button>
                    </div>
                </div>
            </section>

            <section class="textareas-section">
                <div class="textarea-container">
                    <label class="textarea-label" for="inputTextarea">输入文本</label>
                    <div class="textarea-wrapper">
                        <textarea id="inputTextarea" class="json-textarea" placeholder="请输入包含 JSON 的文本..."></textarea>
                    </div>
                </div>
                <div class="textarea-container">
                    <label class="textarea-label" for="outputTextarea">输出结果</label>
                    <div class="textarea-wrapper">
                        <textarea id="outputTextarea" class="json-textarea output-textarea" readonly placeholder="格式化结果或提取的属性..."></textarea>
                    </div>
                </div>
            </section>

            <section class="status-section">
                <div id="statusMessage" class="status-message">准备就绪</div>
                <div class="usage-tip">
                    路径示例：
                    <code>$.name</code><code>data.user.name</code><code>data.users[0].name</code>
                    <code>data.users[*].name</code><code>data.*</code><code>data.users[*].name:^A</code>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/json.js"></script>
    <script src="../js/json-int64.js"></script>
    <script src="../js/json-path.js"></script>
    <script>
        // DOM 元素
        const inputTextarea = document.getElementById('inputTextarea');
        const outputTextarea = document.getElementById('outputTextarea');
        const jsonpathInput = document.getElementById('jsonpathInput');
        const formatBtn = document.getElementById('formatBtn');
        const extractBtn = document.getElementById('extractBtn');
        const tidyBtn = document.getElementById('tidyBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusMessage = document.getElementById('statusMessage');

        // 初始化
        function init() {
            // 添加事件监听器
            formatBtn.addEventListener('click', formatJSON);
            extractBtn.addEventListener('click', extractJSONPath);
            tidyBtn.addEventListener('click', tidyInput);
            copyBtn.addEventListener('click', copyResult);
            clearBtn.addEventListener('click', clearAll);
            // 回车即提取
            jsonpathInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') extractJSONPath();
            });
        }

        // 格式化文本中的所有 JSON 部分，保留非 JSON 部分
        function formatJSONInText(text) {
            // 正则表达式匹配 JSON 对象或数组
            const jsonPattern = /(\{[\s\S]*?\}|\[[\s\S]*?\])/g;
            
            // 替换所有匹配的 JSON 部分
            return text.replace(jsonPattern, (match) => {
                try {
                    // 尝试解析和格式化 JSON（int64 安全）
                    const jsonObj = JSONInt64.parse(match);
                    return JSONInt64.stringify(jsonObj, null, 2);
                } catch {
                    // 如果解析失败，返回原始匹配内容
                    return match;
                }
            });
        }

        // 格式化 JSON
        function formatJSON() {
            const inputText = inputTextarea.value;
            
            if (!inputText.trim()) {
                updateStatus('请输入文本', 'error');
                return;
            }

            try {
                // 格式化文本中的所有 JSON 部分，保留非 JSON 部分
                const formattedText = formatJSONInText(inputText);
                // 显示结果
                outputTextarea.value = formattedText;
                updateStatus('JSON 格式化成功', 'success');
            } catch (error) {
                updateStatus(`错误: ${error.message}`, 'error');
                outputTextarea.value = `错误: ${error.message}`;
            }
        }

        /** 把提取到的值转成可展示文本；对象/数组走缩进序列化 */
        function stringifyValue(value) {
            if (value !== null && typeof value === 'object') {
                return JSONInt64.stringify(value, null, 2);
            }
            return String(value);
        }

        // 提取路径属性（支持 $ 前缀、数组下标、* 通配、正则过滤）
        function extractJSONPath() {
            const inputText = inputTextarea.value;
            const jsonpath = jsonpathInput.value.trim();

            if (!inputText.trim()) {
                updateStatus('请输入文本', 'error');
                return;
            }

            if (!jsonpath) {
                updateStatus('请输入路径表达式', 'error');
                return;
            }

            try {
                // 提取文本中的所有 JSON
                const jsonMatches = extractAllJSONFromText(inputText);

                if (jsonMatches.length === 0) {
                    updateStatus('未找到 JSON 内容', 'error');
                    outputTextarea.value = '未找到 JSON 内容';
                    return;
                }

                const results = [];
                let hits = 0;
                jsonMatches.forEach((match, index) => {
                    try {
                        const jsonObj = JSONInt64.parse(match.json);
                        const values = JSONPath.extract(jsonObj, jsonpath);

                        if (values.length === 0) {
                            results.push(`JSON ${index + 1}: 未找到匹配的属性`);
                        } else {
                            hits += values.length;
                            const formatted = values.length === 1
                                ? stringifyValue(values[0])
                                : JSONInt64.stringify(values, null, 2);
                            results.push(`JSON ${index + 1}:\n${formatted}`);
                        }
                    } catch (error) {
                        results.push(`JSON ${index + 1}: ${error.message}`);
                    }
                });

                outputTextarea.value = results.join('\n\n');
                if (hits === 0) {
                    updateStatus(`已处理 ${jsonMatches.length} 个 JSON，但没有命中任何属性`, 'error');
                } else {
                    updateStatus(`成功处理 ${jsonMatches.length} 个 JSON，命中 ${hits} 个值`, 'success');
                }
            } catch (error) {
                updateStatus(`错误: ${error.message}`, 'error');
                outputTextarea.value = `错误: ${error.message}`;
            }
        }

        // 美化输入：整段是合法 JSON 时整体缩进，否则退化为「只美化其中的 JSON 片段」
        function tidyInput() {
            const inputText = inputTextarea.value;

            if (!inputText.trim()) {
                updateStatus('请输入文本', 'error');
                return;
            }

            try {
                inputTextarea.value = JSONInt64.stringify(JSONInt64.parse(inputText), null, 2);
                updateStatus('输入已美化', 'success');
            } catch (error) {
                inputTextarea.value = formatJSONInText(inputText);
                updateStatus('输入不是完整 JSON，已美化其中的 JSON 片段', 'success');
            }
        }

        // 复制结果
        function copyResult() {
            if (!outputTextarea.value.trim()) {
                updateStatus('没有可复制的内容', 'error');
                return;
            }

            const done = () => {
                const original = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                setTimeout(() => { copyBtn.textContent = original; }, 1000);
                updateStatus('已复制到剪贴板', 'success');
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputTextarea.value).then(done, () => {
                    legacyCopy() ? done() : updateStatus('复制失败，请手动选中复制', 'error');
                });
            } else {
                legacyCopy() ? done() : updateStatus('复制失败，请手动选中复制', 'error');
            }
        }

        /** file:// 场景下的兜底复制 */
        function legacyCopy() {
            try {
                const prev = outputTextarea.readOnly;
                outputTextarea.readOnly = false;
                outputTextarea.select();
                outputTextarea.setSelectionRange(0, 999999);
                const ok = document.execCommand('copy');
                outputTextarea.readOnly = prev;
                return ok;
            } catch (e) {
                return false;
            }
        }

        // 清空所有
        function clearAll() {
            inputTextarea.value = '';
            outputTextarea.value = '';
            jsonpathInput.value = '';
            updateStatus('准备就绪', '');
        }

        // 更新状态信息
        function updateStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type ? `status-${type}` : ''}`;
        }

        // 初始化
        init();
    </script>
</body>
</html>
